services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: serralheria
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/serralheria
      ADMIN_PASSWORD: troque-por-uma-senha-forte
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - db
volumes:
  pgdata: